    <title>Counter</title>

  <body
    class="d-flex flex-column justify-content-center align-items-center m-0"
  >
    <div
      class="design d-flex justify-content-center text-center flex-column fs-6 text-light"
    >
      <h1>Welcome to counter website</h1>
      <p>Here you can Add and Subtract counter - That's Simple</p>
    </div>
    <div class="counter d-flex justify-content-between gap-0 w-25 m-auto">
      <button class="bg-transparent border-0 m-4 fs-3" onclick="decrement()">
        -
      </button>
      <h1 id="Displayednumber" class="m-auto text-danger">0</h1>
      <button class="bg-transparent border-0 m-4 fs-3" onclick="increment()">
        +
      </button>
    </div>

    <script src="Java Script/bootstrap.bundle.js"></script>
    <script src="counter.js"></script>
  </body>
